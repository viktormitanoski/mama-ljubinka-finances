name: Build to deploy branch

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-push-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Generate js/firebase-config.js from environment secrets
        run: |
          mkdir -p js
          cat > js/firebase-config.js << 'EOF'
          import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
          import { getFirestore } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
          import { getAuth } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

          const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}"
          };

          const app = initializeApp(firebaseConfig);
          export const db = getFirestore(app);
          export const auth = getAuth(app);
          EOF

      - name: Prepare deploy tree (copy repo contents safely)
        run: |
          rm -rf deploy
          mkdir deploy
          rsync -a ./ deploy/ \
            --exclude "deploy" \
            --exclude ".git" \
            --exclude ".github"  # optional: don't ship CI files

      - name: Push to deploy branch (same repo)
        working-directory: deploy
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          git init
          git config user.name "${ACTOR}"
          git config user.email "${ACTOR}@users.noreply.github.com"
          git add -A
          git commit -m "Deploy $(date -u +'%Y-%m-%dT%H:%M:%SZ') from ${GITHUB_SHA}"
          git branch -M deploy
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git push -f origin deploy
